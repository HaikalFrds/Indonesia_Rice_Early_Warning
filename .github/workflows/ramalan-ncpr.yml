name: Ramalan NCPR

# Menjalankan notebook FT-Transformer dan memperbarui notebooks/ncpr_2027.json (dibaca website PANGNUSA)
# setiap kali dataset atau notebook di-push, atau dijalankan manual dari tab Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/processed/dataset_gabungan_kabupaten.csv
      - notebooks/Kelompok_6_FT_Transformer_v2.ipynb

permissions:
  contents: write

concurrency: ramalan-ncpr

jobs:
  ramal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Versi dikunci sama dengan laptop, supaya hasilnya sedekat mungkin dengan run lokal
      - name: Install library
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pandas==2.3.3 numpy==2.2.6 scikit-learn==1.7.2 matplotlib==3.10.8 ipykernel==7.3.0 nbconvert

      - name: Jalankan notebook
        run: >
          jupyter nbconvert --to notebook --execute --inplace
          --ExecutePreprocessor.timeout=-1 --ExecutePreprocessor.kernel_name=python3
          notebooks/Kelompok_6_FT_Transformer_v2.ipynb

      # Push dari GITHUB_TOKEN tidak memicu workflow lagi, jadi tidak terjadi loop
      - name: Simpan hasil ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/ncpr_2027.json notebooks/hasil notebooks/Kelompok_6_FT_Transformer_v2.ipynb
          git diff --cached --quiet || git commit -m "Perbarui ramalan NCPR (GitHub Actions)"
          git push
